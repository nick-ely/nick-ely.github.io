<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scorekeeper</title>
<meta name="theme-color" content="#0d1210">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Scorekeeper">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root{
    --bg:#0d1210; --felt:#14201b; --card:#1b2a24; --line:rgba(255,255,255,.08);
    --ink:#f3efe4; --muted:#9aa8a0; --gold:#e9c46a; --red:#e76f51; --green:#5cc8a1;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  body{padding:env(safe-area-inset-top) 0 calc(24px + env(safe-area-inset-bottom))}
  .wrap{max-width:720px;margin:0 auto;padding:16px}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 14px}
  h1{font:800 26px/1 Georgia,serif;margin:0;letter-spacing:-.01em}
  h1 span{color:var(--gold)}
  h2{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px;font-weight:700}
  button{font:inherit;color:inherit;border:0;cursor:pointer}
  .btn{background:var(--card);border:1px solid var(--line);padding:10px 14px;border-radius:12px;font-weight:600}
  .btn.primary{background:var(--gold);color:#1a1405;border-color:transparent}
  .btn.danger{color:var(--red)}
  .btn:active{transform:scale(.97)}
  .icon{background:none;padding:6px 8px;color:var(--muted);font-size:18px;border-radius:8px}
  input{font:inherit;color:var(--ink);background:var(--felt);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%;outline:none}
  input:focus{border-color:var(--gold)}
  .row{display:flex;gap:8px;align-items:center}
  .muted{color:var(--muted)}
  .hidden{display:none!important}

  /* settings */
  .settings{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:var(--felt);border:1px solid var(--line);border-radius:16px;padding:12px}
  .settings label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
  .seg{display:flex;background:var(--bg);border-radius:12px;padding:3px}
  .seg button{flex:1;padding:9px 6px;border-radius:9px;background:none;color:var(--muted);font-weight:600;font-size:14px}
  .seg button.on{background:var(--card);color:var(--ink)}

  /* scoreboard */
  .board{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .p{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
  .p.lead{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
  .p .name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:26px}
  .p .total{font:800 38px/1.1 Georgia,serif;margin-top:4px;font-variant-numeric:tabular-nums}
  .p .sub{font-size:12px;color:var(--muted)}
  .p .crown{position:absolute;top:10px;right:10px;font-size:16px}
  .p .rm{position:absolute;bottom:6px;right:4px}
  .bar{height:4px;background:var(--bg);border-radius:4px;margin-top:8px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--green);border-radius:4px}

  /* round entry */
  .entry{background:var(--felt);border:1px solid var(--line);border-radius:16px;padding:12px}
  .erow{display:grid;grid-template-columns:1fr 52px 120px;gap:8px;align-items:center;margin-bottom:8px}
  .erow .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .erow input{text-align:right;font-size:20px;font-weight:700;padding:10px 12px;font-variant-numeric:tabular-nums}
  .sign{height:46px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:20px;font-weight:800;color:var(--green)}
  .sign.neg{color:var(--red)}

  /* history */
  .tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px}
  table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
  th,td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
  th:first-child,td:first-child{text-align:left;color:var(--muted);position:sticky;left:0;background:var(--bg)}
  thead th{font-size:13px;color:var(--muted);font-weight:600}
  tbody tr{cursor:pointer}
  tbody tr:active td{background:var(--felt)}
  tbody tr.editing td{background:rgba(233,196,106,.12)}
  tfoot td{font-weight:800;border-bottom:0;background:var(--felt)}
  tfoot td:first-child{background:var(--felt);color:var(--ink)}
  .neg{color:var(--red)}

  .banner{background:linear-gradient(120deg,var(--gold),#f4a261);color:#1a1405;border-radius:16px;padding:14px 16px;font-weight:700;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .banner .big{font:800 22px/1.1 Georgia,serif}
  .empty{text-align:center;color:var(--muted);padding:22px;border:1px dashed var(--line);border-radius:16px}
  .footer{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
  .status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .status i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
  .status.live i{background:var(--green)} .status.saving i{background:var(--gold)} .status.off i{background:var(--red)}
  td.miss{color:var(--muted)}
  .erow input.dirty{border-color:var(--gold)}
  .hdr-btns{display:flex;gap:8px;align-items:center}
  .gname{font-size:14px;font-weight:600;margin-top:4px;cursor:pointer;color:var(--ink);background:none;padding:0;text-align:left}
  .gname:after{content:" ✎";color:var(--muted);font-size:12px}
  .games{background:var(--felt);border:1px solid var(--line);border-radius:16px;padding:12px}
  .gitem{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;background:var(--card);border:1px solid var(--line);margin-bottom:8px;cursor:pointer}
  .gitem.cur{border-color:var(--gold)}
  .gitem .gi{flex:1;min-width:0}
  .gitem b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .gitem small{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--card);border:1px solid var(--line);padding:10px 14px;border-radius:12px;display:flex;gap:12px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.4);z-index:5}
  .toast button{color:var(--gold);background:none;font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Score<span>keeper</span></h1>
      <button class="gname" id="gameName" title="Rename this game"></button>
      <div class="status" id="status"><i></i><span>This phone only</span></div>
    </div>
    <div class="hdr-btns">
      <button class="btn" id="gamesBtn">Games</button>
      <button class="btn" id="shareBtn">Share</button>
      <button class="btn" id="settingsBtn">⚙︎</button>
    </div>
  </header>

  <div class="settings hidden" id="settings">
    <div>
      <label>Play to</label>
      <input id="target" type="text" inputmode="numeric" placeholder="none">
    </div>
    <div>
      <label>Winner has</label>
      <div class="seg" id="mode">
        <button data-v="high">Highest</button>
        <button data-v="low">Lowest</button>
      </div>
    </div>
    <div style="grid-column:1/-1" class="row">
      <button class="btn" data-preset="500,high">Rummy 500</button>
      <button class="btn" data-preset="100,high">Gin (100)</button>
      <button class="btn" data-preset="0,low">Low wins</button>
    </div>
  </div>

  <div class="games hidden" id="games">
    <div class="row" style="justify-content:space-between;margin-bottom:10px">
      <b>Saved games</b>
      <button class="btn primary" id="newGameTop">+ New game</button>
    </div>
    <div id="gameList"><div class="muted">Loading…</div></div>
  </div>

  <div id="bannerSlot"></div>

  <h2>Players</h2>
  <div class="board" id="board"></div>
  <form class="row" id="addForm" style="margin-top:10px">
    <input id="newName" placeholder="Add player name" autocomplete="off" enterkeyhint="done">
    <button class="btn primary" type="submit">Add</button>
  </form>

  <div id="entrySection" class="hidden">
    <h2 id="entryTitle">Round 1</h2>
    <form class="entry" id="entryForm">
      <div id="entryRows"></div>
      <div class="row" style="margin-top:4px">
        <button class="btn hidden" type="button" id="cancelEdit">Cancel</button>
        <button class="btn primary" type="submit" style="flex:1" id="saveRound">Save</button>
      </div>
      <p class="muted" id="entryHint" style="font-size:13px;margin:10px 2px 0"></p>
      <button class="btn hidden" type="button" id="closeRound" style="width:100%;margin-top:8px">Finish round (blanks count as 0)</button>
    </form>
  </div>

  <h2>Rounds</h2>
  <div id="history"></div>

  <div class="footer">
    <button class="btn" id="newGame">New game · same players</button>
    <button class="btn danger" id="resetAll">Clear everything</button>
  </div>
</div>
<div class="toast hidden" id="toast"><span id="toastMsg"></span><button id="toastUndo">Undo</button></div>

<script>
// Paste the Google Apps Script web-app URL here to share games across phones.
// Leave empty and the app keeps scores on this phone only.
const SHEET_URL = 'https://script.google.com/macros/s/AKfycbxHAtRuCroIypSSPxfP-qDJIowpEU401tMwKkmNlPb2RdcHH1A20E6p8Vsx0_roNv5g/exec';

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const fresh = () => ({ players: [], rounds: [], target: 500, mode: 'high', v: 0, name: defaultName() });
const defaultName = () => 'Game · ' + new Date().toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
const IKEY = 'scorekeeper-index';

// game id from ?g= so a shared link opens the same game
const params = new URLSearchParams(location.search);
let G = (params.get('g') || '').replace(/[^a-z0-9]/gi, '').slice(0, 20);
if (!G) {
  try { G = localStorage.getItem('scorekeeper-last-game') || ''; } catch(e){}
  if (!G) G = uid();
  params.set('g', G); history.replaceState(null, '', '?' + params);
}
try { localStorage.setItem('scorekeeper-last-game', G); } catch(e){}
const LKEY = 'scorekeeper-v2-' + G;

let S = (() => {
  try {
    const cur = JSON.parse(localStorage.getItem(LKEY));
    if (cur) return cur;
    // bring over a game saved by the first version of the app
    const old = JSON.parse(localStorage.getItem('scorekeeper-v1'));
    if (old && old.players && old.players.length) {
      localStorage.removeItem('scorekeeper-v1');
      const s = Object.assign(fresh(), old, { v: 0 });
      localStorage.setItem(LKEY, JSON.stringify(s));
      return s;
    }
  } catch(e){}
  return fresh();
})();
if (S.players.length) saveLocal();
let editing = null, undoState = null, toastTimer = null, inflight = 0;

// ---- shared game logic (identical copy lives in apps-script.gs) ----
function applyOp(s, o) {
  s.players = s.players || []; s.rounds = s.rounds || [];
  var clean = function (v) { v = Math.round(Number(v)); return isFinite(v) ? Math.max(-99999, Math.min(99999, v)) : 0; };
  var has = function (id) { return s.players.some(function (p) { return p.id === id; }); };
  switch (o.op) {
    case 'addPlayer': {
      var id = String(o.id || '').replace(/[^a-z0-9]/gi, '').slice(0, 12);
      var name = String(o.name || '').trim().slice(0, 30);
      if (id && name && !has(id)) s.players.push({ id: id, name: name });
      break;
    }
    case 'renamePlayer': {
      var n = String(o.name || '').trim().slice(0, 30);
      s.players.forEach(function (p) { if (p.id === o.id && n) p.name = n; });
      break;
    }
    case 'removePlayer':
      s.players = s.players.filter(function (p) { return p.id !== o.id; });
      s.rounds.forEach(function (r) { delete r[o.id]; });
      s.rounds = s.rounds.filter(function (r) { return Object.keys(r).length; });
      break;
    case 'setScores': {
      var i = o.index | 0;
      if (i < 0 || i > s.rounds.length) i = s.rounds.length;
      if (i === s.rounds.length) s.rounds.push({});
      var r = s.rounds[i], sc = o.scores || {};
      Object.keys(sc).forEach(function (k) {
        if (!has(k)) return;
        if (sc[k] === null) delete r[k]; else r[k] = clean(sc[k]);
      });
      if (!Object.keys(r).length) s.rounds.splice(i, 1);
      break;
    }
    case 'closeRound': {
      var rr = s.rounds[o.index | 0];
      if (rr) s.players.forEach(function (p) { if (!(p.id in rr)) rr[p.id] = 0; });
      break;
    }
    case 'deleteRound': s.rounds.splice(o.index | 0, 1); break;
    case 'newGame': s.rounds = []; break;
    case 'clearAll': s.players = []; s.rounds = []; break;
    case 'settings':
      if ('target' in o) s.target = Math.max(0, clean(o.target));
      if (o.mode === 'high' || o.mode === 'low') s.mode = o.mode;
      if (typeof o.name === 'string' && o.name.trim()) s.name = o.name.trim().slice(0, 40);
      break;
    case 'restore':
      if (o.state) {
        s.players = o.state.players || []; s.rounds = o.state.rounds || [];
        s.target = o.state.target || 0; s.mode = o.state.mode === 'low' ? 'low' : 'high';
        if (o.state.name) s.name = String(o.state.name).slice(0, 40);
      }
      break;
  }
  return s;
}

// ---- sync ----
function setStatus(cls, txt){ const el = $('#status'); el.className = 'status ' + cls; el.lastElementChild.textContent = txt; }
function summary(s){
  return { name: s.name || '', updated: s.updated || new Date().toISOString(), rounds: (s.rounds || []).length, mode: s.mode,
    players: (s.players || []).map(p => ({ name: p.name, total: (s.rounds || []).reduce((a, r) => a + (r[p.id] || 0), 0) })) };
}
function saveLocal(){
  try {
    localStorage.setItem(LKEY, JSON.stringify(S));
    const idx = JSON.parse(localStorage.getItem(IKEY) || '{}');
    if (S.players.length || S.rounds.length) { idx[G] = summary(S); localStorage.setItem(IKEY, JSON.stringify(idx)); }
  } catch(e){}
}

function op(o){
  applyOp(S, o); S.updated = new Date().toISOString(); saveLocal(); render();
  if (!SHEET_URL) return;
  inflight++; setStatus('saving', 'Saving…');
  fetch(SHEET_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ g: G }, o)) })
    .then(r => r.json())
    .then(s => { inflight--; if (!inflight) { S = s; saveLocal(); render(); } setStatus('live', 'Live · shared'); })
    .catch(() => { inflight--; setStatus('off', 'Not saved — check signal'); });
}

function poll(){
  if (!SHEET_URL || inflight || document.hidden) return;
  fetch(SHEET_URL + '?g=' + G + '&t=' + Date.now())
    .then(r => r.json())
    .then(s => { if (!inflight && s.v !== S.v) { S = s; saveLocal(); render(); } setStatus('live', 'Live · shared'); })
    .catch(() => setStatus('off', 'Offline — retrying'));
}
if (SHEET_URL) { setStatus('saving', 'Connecting…'); poll(); setInterval(poll, 3000); document.addEventListener('visibilitychange', poll); }

// ---- helpers ----
const total = id => S.rounds.reduce((a, r) => a + (r[id] || 0), 0);
const complete = r => S.players.every(p => p.id in r);
const currentIndex = () => (S.rounds.length && !complete(S.rounds[S.rounds.length - 1])) ? S.rounds.length - 1 : S.rounds.length;
const nameOf = id => (S.players.find(p => p.id === id) || {}).name || '';

function snapshot(msg){
  undoState = JSON.parse(JSON.stringify({ players: S.players, rounds: S.rounds, target: S.target, mode: S.mode }));
  $('#toastMsg').textContent = msg;
  $('#toast').classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $('#toast').classList.add('hidden'), 6000);
}
$('#toastUndo').onclick = () => { if (undoState) { editing = null; op({ op: 'restore', state: undoState }); undoState = null; } $('#toast').classList.add('hidden'); };

function leaders(){
  const done = S.rounds.filter(complete);
  if (!S.players.length || !done.length) return [];
  const t = S.players.map(p => total(p.id));
  const best = S.mode === 'high' ? Math.max(...t) : Math.min(...t);
  return S.players.filter((p, i) => t[i] === best).map(p => p.id);
}
function winner(){
  if (!S.target || !S.rounds.length || currentIndex() < S.rounds.length) return null;
  return S.players.some(p => total(p.id) >= S.target) ? leaders() : null;
}

// ---- render ----
function render(){
  $('#gameName').textContent = S.name || 'Untitled game';
  document.title = (S.name ? S.name + ' · ' : '') + 'Scorekeeper';
  if (document.activeElement !== $('#target')) $('#target').value = S.target || '';
  document.querySelectorAll('#mode button').forEach(b => b.classList.toggle('on', b.dataset.v === S.mode));

  const w = winner();
  $('#bannerSlot').innerHTML = w && w.length ? `<div class="banner"><div><div style="font-size:12px;letter-spacing:.12em;text-transform:uppercase">Game over</div><div class="big">🏆 ${w.map(id => esc(nameOf(id))).join(' & ')} win${w.length > 1 ? '' : 's'}</div></div><button class="btn" id="againBtn" style="background:#1a1405;color:var(--gold)">Play again</button></div>` : '';
  const again = $('#againBtn'); if (again) again.onclick = newGame;

  const lead = leaders();
  const max = Math.max(1, S.target || 0, ...S.players.map(p => Math.abs(total(p.id))));
  // leader first: highest total in "high" mode, lowest in "low" mode; ties keep join order
  const ranked = S.players.map((p, i) => ({ p, i, t: total(p.id) }))
    .sort((a, b) => (S.mode === 'low' ? a.t - b.t : b.t - a.t) || a.i - b.i);
  const place = n => n + (['th','st','nd','rd'][(n % 100 - 20) % 10] || ['th','st','nd','rd'][n % 100] || 'th');
  const before = {}; document.querySelectorAll('#board .p').forEach(el => before[el.dataset.id] = el.getBoundingClientRect().top);
  $('#board').innerHTML = S.players.length ? ranked.map(({ p }, k) => {
    const t = total(p.id), last = S.rounds.length && (p.id in S.rounds[S.rounds.length - 1]) ? S.rounds[S.rounds.length - 1][p.id] : null;
    const pct = Math.max(0, Math.min(100, t / max * 100));
    const rk = S.rounds.length ? ranked.findIndex(x => x.t === ranked[k].t) + 1 : 0;
    return `<div class="p ${lead.includes(p.id) ? 'lead' : ''}" data-id="${esc(p.id)}">
      ${rk ? `<div class="sub" style="font-weight:700;letter-spacing:.08em">${place(rk)}</div>` : ''}
      ${lead.includes(p.id) ? '<span class="crown">👑</span>' : ''}
      <div class="name" data-rename="${esc(p.id)}">${esc(p.name)}</div>
      <div class="total ${t < 0 ? 'neg' : ''}">${t}</div>
      <div class="sub">${last === null ? '&nbsp;' : 'last ' + (last > 0 ? '+' : '') + last}${S.target && S.mode === 'high' ? ` · ${Math.max(0, S.target - t)} to go` : ''}</div>
      ${S.target ? `<div class="bar"><i style="width:${pct}%;${S.mode === 'low' ? 'background:var(--red)' : ''}"></i></div>` : ''}
      <button class="icon rm" title="Remove" data-remove="${esc(p.id)}">×</button>
    </div>`;
  }).join('') : '<div class="empty" style="grid-column:1/-1">Add players to start.</div>';
  // slide cards to their new spots
  document.querySelectorAll('#board .p').forEach(el => {
    const was = before[el.dataset.id]; if (was === undefined) return;
    const dy = was - el.getBoundingClientRect().top; if (!dy) return;
    el.animate([{ transform: `translateY(${dy}px)` }, { transform: 'none' }], { duration: 400, easing: 'cubic-bezier(.2,.7,.2,1)' });
  });

  renderEntry();
  renderHistory();
}

function renderEntry(){
  $('#entrySection').classList.toggle('hidden', !S.players.length);
  if (editing !== null && editing >= S.rounds.length) editing = null;
  const idx = editing !== null ? editing : currentIndex();
  const r = S.rounds[idx] || {};

  // keep anything this phone has typed but not saved yet
  const kept = {};
  document.querySelectorAll('#entryRows input.dirty').forEach(i => {
    kept[i.dataset.id] = { v: i.value, neg: document.querySelector(`.sign[data-id="${CSS.escape(i.dataset.id)}"]`).classList.contains('neg') };
  });
  const focusId = document.activeElement && document.activeElement.closest && document.activeElement.closest('#entryRows') ? document.activeElement.dataset.id : null;
  const rowsKey = idx + '|' + editing;
  if ($('#entryRows').dataset.key !== rowsKey) { for (const k in kept) delete kept[k]; $('#entryRows').dataset.key = rowsKey; }

  $('#entryTitle').textContent = editing !== null ? `Editing round ${idx + 1}` : `Round ${idx + 1}`;
  $('#saveRound').textContent = editing !== null ? 'Update round' : 'Save my scores';
  $('#cancelEdit').classList.toggle('hidden', editing === null);
  const missing = S.players.filter(p => !(p.id in r));
  const entered = S.players.length - missing.length;
  $('#entryHint').textContent = editing !== null ? '' : entered ? `Waiting on ${missing.map(p => p.name).join(', ')}. Round moves on when everyone is in.` : 'Enter just your own score, or everyone\'s — whoever has a phone.';
  $('#closeRound').classList.toggle('hidden', editing !== null || !entered);

  $('#entryRows').innerHTML = S.players.map(p => {
    const k = kept[p.id];
    const has = p.id in r, v = has ? r[p.id] : null;
    const neg = k ? k.neg : (v !== null && v < 0);
    const val = k ? k.v : (v === null ? '' : String(Math.abs(v)));
    return `<div class="erow">
      <div class="nm">${esc(p.name)}${has && !k ? ' <span class="muted">✓</span>' : ''}</div>
      <button type="button" class="sign ${neg ? 'neg' : ''}" data-id="${esc(p.id)}" aria-label="Toggle sign">${neg ? '−' : '+'}</button>
      <input type="text" inputmode="numeric" pattern="[0-9]*" data-id="${esc(p.id)}" class="${k ? 'dirty' : ''}" placeholder="–" value="${esc(val)}" enterkeyhint="next">
    </div>`;
  }).join('');

  const inputs = [...document.querySelectorAll('#entryRows input')];
  document.querySelectorAll('.sign').forEach(b => b.onclick = () => {
    b.classList.toggle('neg'); b.textContent = b.classList.contains('neg') ? '−' : '+';
    const inp = inputs.find(i => i.dataset.id === b.dataset.id); inp.classList.add('dirty');
  });
  inputs.forEach((inp, i) => {
    inp.oninput = () => {
      if (inp.value.includes('-')) { inp.value = inp.value.replace(/-/g, ''); document.querySelector(`.sign[data-id="${CSS.escape(inp.dataset.id)}"]`).click(); }
      inp.value = inp.value.replace(/[^0-9]/g, '');
      inp.classList.add('dirty');
    };
    inp.onkeydown = e => { if (e.key === 'Enter' && i < inputs.length - 1) { e.preventDefault(); inputs[i + 1].focus(); } };
  });
  if (focusId) { const f = inputs.find(i => i.dataset.id === focusId); if (f) { f.focus(); const n = f.value.length; try { f.setSelectionRange(n, n); } catch(e){} } }
}

function renderHistory(){
  if (!S.rounds.length) { $('#history').innerHTML = '<div class="empty">No rounds yet.</div>'; return; }
  const head = `<tr><th>#</th>${S.players.map(p => `<th>${esc(p.name)}</th>`).join('')}<th></th></tr>`;
  const rows = S.rounds.map((r, i) => `<tr class="${editing === i ? 'editing' : ''}" data-edit="${i}"><td>${i + 1}</td>${S.players.map(p => p.id in r ? `<td class="${r[p.id] < 0 ? 'neg' : ''}">${r[p.id]}</td>` : '<td class="miss">·</td>').join('')}<td><button class="icon" data-del="${i}" title="Delete">🗑</button></td></tr>`).join('');
  const foot = `<tr><td>Total</td>${S.players.map(p => `<td class="${total(p.id) < 0 ? 'neg' : ''}">${total(p.id)}</td>`).join('')}<td></td></tr>`;
  $('#history').innerHTML = `<div class="tablewrap"><table><thead>${head}</thead><tbody>${rows}</tbody><tfoot>${foot}</tfoot></table></div><p class="muted" style="font-size:13px;margin:8px 2px">Tap a round to fix a score.</p>`;
}

// ---- events ----
$('#board').onclick = e => {
  const rn = e.target.closest('[data-rename]'), rm = e.target.closest('[data-remove]');
  if (rn) { const n = prompt('Rename player', nameOf(rn.dataset.rename)); if (n && n.trim()) op({ op: 'renamePlayer', id: rn.dataset.rename, name: n.trim() }); }
  if (rm) { snapshot(`Removed ${nameOf(rm.dataset.remove)}`); editing = null; op({ op: 'removePlayer', id: rm.dataset.remove }); }
};
$('#history').onclick = e => {
  const d = e.target.closest('[data-del]');
  if (d) { const i = +d.dataset.del; if (!confirm(`Delete round ${i + 1}?`)) return; snapshot(`Deleted round ${i + 1}`); editing = null; op({ op: 'deleteRound', index: i }); return; }
  const tr = e.target.closest('[data-edit]');
  if (tr) { editing = +tr.dataset.edit; render(); $('#entrySection').scrollIntoView({ behavior: 'smooth' }); }
};
$('#addForm').onsubmit = e => {
  e.preventDefault();
  const n = $('#newName').value.trim(); if (!n) return;
  $('#newName').value = '';
  op({ op: 'addPlayer', id: uid(), name: n });
  $('#newName').focus();
};
$('#entryForm').onsubmit = e => {
  e.preventDefault();
  const scores = {}; let any = false;
  document.querySelectorAll('#entryRows input.dirty').forEach(i => {
    const neg = document.querySelector(`.sign[data-id="${CSS.escape(i.dataset.id)}"]`).classList.contains('neg');
    scores[i.dataset.id] = i.value === '' ? null : (neg ? -1 : 1) * parseInt(i.value, 10);
    any = true;
  });
  if (!any) return;
  const index = editing !== null ? editing : currentIndex();
  document.querySelectorAll('#entryRows input.dirty').forEach(i => i.classList.remove('dirty'));
  editing = null;
  op({ op: 'setScores', index, scores });
  if (document.activeElement) document.activeElement.blur();
};
$('#cancelEdit').onclick = () => { editing = null; $('#entryRows').dataset.key = ''; render(); };
$('#closeRound').onclick = () => {
  const i = currentIndex(); if (i >= S.rounds.length) return;
  const missing = S.players.filter(p => !(p.id in S.rounds[i])).map(p => p.name);
  if (confirm(`Give ${missing.join(', ')} a 0 and finish round ${i + 1}?`)) op({ op: 'closeRound', index: i });
};
function gameUrl(id){ return location.pathname + '?g=' + id; }
function newGame(){
  // every game is already saved; this starts a fresh one with the same players and settings
  const id = uid();
  const s = Object.assign(fresh(), { players: S.players.map(p => ({ id: p.id, name: p.name })), target: S.target, mode: S.mode });
  const go = () => { location.href = gameUrl(id); };
  try { localStorage.setItem('scorekeeper-v2-' + id, JSON.stringify(s)); } catch(e){}
  if (!SHEET_URL) return go();
  setStatus('saving', 'Creating game…');
  fetch(SHEET_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ g: id, op: 'restore', state: s }) })
    .then(go, go);
}
$('#newGame').onclick = newGame;
$('#resetAll').onclick = () => {
  if (!confirm('Remove all players and scores?')) return;
  snapshot('Cleared players and scores'); editing = null; op({ op: 'clearAll' });
};
$('#shareBtn').onclick = async () => {
  const url = location.origin + location.pathname + '?g=' + G;
  if (!SHEET_URL) alert('Sharing needs the Google Sheet hookup first — until then scores stay on this phone.');
  try { if (navigator.share) { await navigator.share({ title: 'Scorekeeper', text: 'Join the game and enter your score', url }); return; } } catch(e){ return; }
  try { await navigator.clipboard.writeText(url); alert('Link copied:\n' + url); } catch(e){ prompt('Copy this link', url); }
};

let tgtTimer;
function fmtWhen(iso){
  if (!iso) return '';
  const d = new Date(iso), now = new Date();
  return d.toDateString() === now.toDateString() ? d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : d.toLocaleDateString([], { month: 'short', day: 'numeric' });
}
function renderGames(list){
  list = list.filter(x => x.g === G || x.players.length);
  if (!list.some(x => x.g === G)) list.unshift(Object.assign({ g: G }, summary(S)));
  $('#gameList').innerHTML = list.map(x => {
    const best = x.players.length ? x.players.reduce((a, b) => (x.mode === 'low' ? b.total < a.total : b.total > a.total) ? b : a) : null;
    const who = x.players.map(p => p.name).join(', ') || 'No players yet';
    return `<div class="gitem ${x.g === G ? 'cur' : ''}" data-open="${esc(x.g)}">
      <div class="gi"><b>${esc(x.name || 'Untitled game')}${x.g === G ? ' <span class="muted">· open now</span>' : ''}</b>
      <small>${esc(who)}</small>
      <small>${x.rounds} round${x.rounds === 1 ? '' : 's'}${best && x.rounds ? ' · ' + esc(best.name) + ' leads with ' + best.total : ''} · ${esc(fmtWhen(x.updated))}</small></div>
      ${x.g === G ? '' : `<button class="icon" data-delgame="${esc(x.g)}" title="Delete game">🗑</button>`}
    </div>`;
  }).join('');
}
function loadGames(){
  if (!SHEET_URL) {
    let idx = {}; try { idx = JSON.parse(localStorage.getItem(IKEY) || '{}'); } catch(e){}
    renderGames(Object.keys(idx).map(g => Object.assign({ g }, idx[g])).sort((a, b) => a.updated < b.updated ? 1 : -1));
    return;
  }
  $('#gameList').innerHTML = '<div class="muted">Loading…</div>';
  fetch(SHEET_URL + '?list=1&t=' + Date.now()).then(r => r.json()).then(renderGames)
    .catch(() => { $('#gameList').innerHTML = '<div class="muted">Couldn\'t load the game list — check signal.</div>'; });
}
$('#gamesBtn').onclick = () => { const el = $('#games'); el.classList.toggle('hidden'); if (!el.classList.contains('hidden')) loadGames(); };
$('#newGameTop').onclick = () => newGame();
$('#gameList').onclick = e => {
  const del = e.target.closest('[data-delgame]');
  if (del) {
    const g = del.dataset.delgame, name = del.closest('.gitem').querySelector('b').textContent;
    if (!confirm(`Delete "${name}" for everyone? This can't be undone.`)) return;
    try { localStorage.removeItem('scorekeeper-v2-' + g); const idx = JSON.parse(localStorage.getItem(IKEY) || '{}'); delete idx[g]; localStorage.setItem(IKEY, JSON.stringify(idx)); } catch(err){}
    if (SHEET_URL) fetch(SHEET_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ g, op: 'deleteGame' }) }).then(loadGames, loadGames);
    else loadGames();
    return;
  }
  const o = e.target.closest('[data-open]');
  if (o && o.dataset.open !== G) location.href = gameUrl(o.dataset.open);
};
$('#gameName').onclick = () => {
  const n = prompt('Name this game', S.name || '');
  if (n && n.trim()) op({ op: 'settings', name: n.trim() });
};
$('#settingsBtn').onclick = () => $('#settings').classList.toggle('hidden');
$('#target').oninput = e => { clearTimeout(tgtTimer); const v = parseInt(e.target.value.replace(/\D/g, ''), 10) || 0; tgtTimer = setTimeout(() => op({ op: 'settings', target: v }), 600); };
document.querySelectorAll('#mode button').forEach(b => b.onclick = () => op({ op: 'settings', mode: b.dataset.v }));
document.querySelectorAll('[data-preset]').forEach(b => b.onclick = () => { const [t, m] = b.dataset.preset.split(','); op({ op: 'settings', target: +t, mode: m }); });

render();
</script>
